[pytest]
testpaths = tests
pythonpath = .
# -ra lists skipped tests with their reasons in the summary.
addopts = -ra
markers =
    phase1: Phase 1 (steps 1-5) - the complete working app
    phase2: Phase 2 (steps 6-11) - differentiators
    step1: backend skeleton, upload, image/meta, document list
    step2: OCR, provider, merge/confidence, /extract, model comparison
    step3: frontend contract and form save (PUT /data)
    step4: RAG + grounded chat
    step5: hardening - startup checks, error handling, .env.example, security baseline
    step6: bounding-box matching and highlights
    step8: Dockerfile
    step9: README
    step10: Ollama provider (optional stretch)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
